# FastSpeech 2 - Telugu (IndicTTS Telugu, 1 male + 1 female studio speaker)
# Relative paths are resolved against this file's folder.
language: telugu

preprocess:
  dataset: IndicTTS_Telugu
  source:
    hf_name: SPRINGLab/IndicTTS_Telugu   # ~8.74 h: male 4.47 h, female 4.27 h, 48 kHz
    hf_split: train
    local_dir: null                  # alternative: original IIT-M release folder (wav/ + txt.done.data)
  selection:
    train_hours: 5.0
    val_hours: 1.0
    min_duration: 1.0                # seconds
    max_duration: 15.0               # decoder max_seq_len 1500 frames ~ 17.4 s
    min_words: 2
    min_chars_per_sec: 4.0
    max_chars_per_sec: 25.0
    min_snr_db: 0.0                  # studio data, no SNR filter needed
    speaker_cap_frac: 0.5            # 2 speakers -> balanced 3 h + 3 h
    seed: 1234
  path:
    raw_path: ../data/Telugu/raw                  # MFA corpus: <speaker>/<uid>.wav|.lab
    textgrid_path: ../data/Telugu/TextGrid
    preprocessed_path: ../data/Telugu/preprocessed
  alignment:
    mode: train                      # no pretrained Telugu MFA model: train on the corpus
    pretrained_model: null
    beam: 10                         # MFA defaults: wide beams stall from-scratch training on bad clips
    retry_beam: 40
    mfa_config: ./mfa_train_config.yaml   # monophone -> triphone -> LDA (no SAT, see file)
  preprocessing:
    text:
      language: te
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000                 # HiFi-GAN universal vocoder expects 8 kHz
    pitch:
      feature: phoneme_level
      normalization: true
    energy:
      feature: phoneme_level
      normalization: true

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: true
  max_seq_len: 1500
  vocoder:
    model: HiFi-GAN
    speaker: universal

train:
  seed: 1234
  num_workers: 4
  path:
    ckpt_path: ./checkpoints
    log_path: ../logs/Telugu
    result_path: ../Results/Telugu
  optimizer:
    batch_size: 16
    group_size: 4
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [60000, 80000, 90000]
    anneal_rate: 0.3
  step:
    total_step: 100000
    log_step: 100
    val_step: 1000
    save_step: 10000

inference:
  checkpoint: latest   # latest | val_best | <step>; chosen by listening (val-loss minimum sounded worse)
  speaker: auto        # 'auto' = speaker with the most training audio; or te_0 / te_1 (IndicTTS gender column is numeric)
